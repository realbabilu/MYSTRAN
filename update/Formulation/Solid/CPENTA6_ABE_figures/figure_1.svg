<svg aria-label="CPENTA6 nodal numbering (Nastran)" role="img" viewbox="0 0 560 340" xmlns="http://www.w3.org/2000/svg"><style>
:root{--bg:#fff;--fg:#1d1f23;--mut:#5a6070;--rule:#d5d9e0;--acc:#1f5fa8;--box:#f4f6fa;--good:#2e7d32;--bad:#b3261e;--face1:rgba(31,95,168,.12);--face2:rgba(31,95,168,.06);--tie:#c2410c;--gp:#1f5fa8;--bar:#9aa3b5}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e6e8ec;--mut:#9aa3b2;--rule:#2d323b;--acc:#7fb0f0;--box:#1b1e24;--good:#7fd18a;--bad:#ff8a80;--face1:rgba(127,176,240,.16);--face2:rgba(127,176,240,.08);--tie:#fb923c;--gp:#7fb0f0;--bar:#6b7487}}
*{box-sizing:border-box}html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.62 Georgia,'Times New Roman',serif}
main{max-width:860px;margin:0 auto;padding:34px 22px 80px}
h1{font-size:1.75rem;line-height:1.25;margin:.2em 0 .3em}h2{font-size:1.28rem;margin:2.1em 0 .5em;border-bottom:1px solid var(--rule);padding-bottom:.25em}h3{font-size:1.05rem;margin:1.5em 0 .4em}
.by{color:var(--mut);margin:0 0 1.4em;font-size:.98rem}.by b{color:var(--fg)}
p{margin:.65em 0}code,.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.eq{background:var(--box);border-left:3px solid var(--acc);padding:.6em .9em;margin:.8em 0;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88rem;line-height:1.7;white-space:pre}
table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:.9rem;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--rule);padding:.38em .6em;text-align:left;vertical-align:top}th{background:var(--box);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
figure{margin:1.2em 0}figure svg{width:100%;height:auto;background:var(--box);border:1px solid var(--rule);border-radius:6px}figcaption{color:var(--mut);font-size:.9rem;margin-top:.4em}
.note{background:var(--box);border:1px solid var(--rule);border-radius:6px;padding:.7em 1em;margin:1em 0;font-size:.95rem}.note b{color:var(--acc)}
.refs li{margin:.55em 0}.refs i{font-style:italic}
svg text{fill:var(--fg);font:12px ui-monospace,Menlo,Consolas,monospace}svg .cap{fill:var(--mut);font-size:11.5px}svg .nl{font-weight:700;font-size:13px}svg .ns{font-size:11px;fill:var(--mut)}svg .nl2{font:12px Georgia,serif}
svg .edge{stroke:var(--fg);stroke-width:1.6;fill:none}svg .edgepoly{stroke:var(--fg);stroke-width:1.6;fill:none}svg .face.top{fill:var(--face1)}svg .face.bot{fill:var(--face2)}svg .plane{fill:none;stroke:var(--acc);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
svg .node{fill:var(--fg)}svg .gp{fill:var(--gp);stroke:var(--bg);stroke-width:1.5}svg .tie{fill:var(--tie);stroke:var(--bg)}svg .cen{stroke:var(--fg);stroke-width:2;fill:none}svg .axes line{stroke:var(--acc);stroke-width:1.8}svg .axes text{fill:var(--acc);font-style:italic;font-size:14px}
svg .grid{stroke:var(--rule);stroke-width:1}svg .ref{stroke:var(--good);stroke-width:2;stroke-dasharray:5 4}svg .bar-bad{fill:var(--bad);opacity:.75}svg .bar-eas{fill:var(--bar)}svg .bar-abe1{fill:var(--acc);opacity:.65}svg .bar-abe{fill:var(--acc)}svg .bar-ref{fill:var(--good);opacity:.8}
svg .legend text{font-size:11.5px}
</style>
<polygon class="face top" points="90.0,100.0 290.0,100.0 190.0,30.0"></polygon>
<polygon class="face bot" points="90.0,250.0 290.0,250.0 190.0,180.0"></polygon>
<line class="edge" x1="90.0" x2="290.0" y1="250.0" y2="250.0"></line>
<line class="edge" stroke-dasharray="6 5" x1="90.0" x2="190.0" y1="250.0" y2="180.0"></line>
<line class="edge" stroke-dasharray="6 5" x1="290.0" x2="190.0" y1="250.0" y2="180.0"></line>
<line class="edge" x1="90.0" x2="290.0" y1="100.0" y2="100.0"></line>
<line class="edge" x1="90.0" x2="190.0" y1="100.0" y2="30.0"></line>
<line class="edge" x1="290.0" x2="190.0" y1="100.0" y2="30.0"></line>
<line class="edge" x1="90.0" x2="90.0" y1="250.0" y2="100.0"></line>
<line class="edge" x1="290.0" x2="290.0" y1="250.0" y2="100.0"></line>
<line class="edge" stroke-dasharray="6 5" x1="190.0" x2="190.0" y1="180.0" y2="30.0"></line>
<circle class="node" cx="90.0" cy="250.0" r="6"></circle>
<circle class="node" cx="290.0" cy="250.0" r="6"></circle>
<circle class="node" cx="190.0" cy="180.0" r="6"></circle>
<circle class="node" cx="90.0" cy="100.0" r="6"></circle>
<circle class="node" cx="290.0" cy="100.0" r="6"></circle>
<circle class="node" cx="190.0" cy="30.0" r="6"></circle>
<text class="nl" x="42.0" y="268.0">G1</text>
<text class="ns" x="42.0" y="281.0">(0,0,-1)</text>
<text class="nl" x="304.0" y="268.0">G2</text>
<text class="ns" x="304.0" y="281.0">(1,0,-1)</text>
<text class="nl" x="204.0" y="186.0">G3</text>
<text class="ns" x="204.0" y="199.0">(0,1,-1)</text>
<text class="nl" x="42.0" y="94.0">G4</text>
<text class="ns" x="42.0" y="107.0">(0,0,+1)</text>
<text class="nl" x="304.0" y="96.0">G5</text>
<text class="ns" x="304.0" y="109.0">(1,0,+1)</text>
<text class="nl" x="202.0" y="22.0">G6</text>
<text class="ns" x="202.0" y="35.0">(0,1,+1)</text>
<g class="axes"><line x1="90.0" x2="160.0" y1="250.0" y2="250.0"></line><text x="166.0" y="254.0">r</text>
<line x1="90.0" x2="125.0" y1="250.0" y2="225.5"></line><text x="130.0" y="223.0">s</text>
<line x1="90.0" x2="90.0" y1="250.0" y2="188.0"></line><text x="86.0" y="182.0">ζ</text></g>
<text class="cap" x="370" y="70">top face  ζ = +1 : G4-G5-G6</text>
<text class="cap" x="370" y="250">bottom face  ζ = −1 : G1-G2-G3</text>
<text class="cap" x="370" y="120">vertical edges G1-G4, G2-G5, G3-G6</text>
<text class="cap" x="370" y="145">r : G1→G2,  s : G1→G3,  ζ : bottom→top</text>
<text class="cap" x="370" y="170">dashed = hidden edges</text>
</svg>