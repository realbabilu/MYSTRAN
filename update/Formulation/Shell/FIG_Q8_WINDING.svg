s="sub">ξ →</text><text x="96" y="112" class="sub">η ↑</text><text x="101" y="474" class="sm">(-1,-1)</text><text x="416" y="474" class="sm">(1,-1)</text><text x="432" y="102" class="sm">(1,1)</text><text x="78" y="102" class="sm">(-1,1)</text><rect class="note" x="525" y="114" width="412" height="295" rx="12"/><text x="548" y="150" class="h" style="font-size:20px">Orientation</text><text x="548" y="187" class="sub">1 → 2 → 3 → 4 → 1 (CCW)</text><text x="548" y="217" class="sub">5: edge 1–2 · 6: edge 2–3</text><text x="548" y="243" class="sub">7: edge 3–4 · 8: edge 4–1</text><text x="548" y="283" class="sub">Reverse connectivity:</text><text x="548" y="310" class="sm" style="font-family:monospace">[1,4,3,2,8,7,6,5]</text><text x="548" y="355" class="sub">n = (gξ × gη) / ‖gξ × gη‖</text><text x="548" y="385" class="sm">Reversing winding reverses n, not physical stress.</text></svg>
