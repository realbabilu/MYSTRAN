<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 505" role="img" aria-label="FIG_T6_WINDING.svg"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263449}.h{font-size:24px;font-weight:700}.sub{font-size:15px}.sm{font-size:13px}.idx{font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}.corner{fill:#165f99;stroke:#fff;stroke-width:2}.mid{fill:#df8b28;stroke:#fff;stroke-width:2}.gauss{fill:#2d9e81;stroke:#fff;stroke-width:1.5}.tying{fill:#c94d65;stroke:#fff;stroke-width:1.5}.axis{stroke:#6b7786;stroke-width:2}.frame{stroke:#203850;stroke-width:2.6;fill:#f9fbfd}.note{fill:#f6f8fb;stroke:#cad3df}</style><text class="h" x="32" y="40">CTRIA6 · local connectivity and barycentric coordinates</text><text class="sub" x="32" y="66">Quadratic triangle · CCW normal +e3 · L1 + L2 + L3 = 1</text><polygon class="frame" points="120,440 490,440 300,100"/><circle class="corner" cx="120" cy="440" r="13"/><text class="idx" x="120" y="440" fill="white" style="fill:white">1</text><circle class="corner" cx="490" cy="440" r="13"/><text class="idx" x="490" y="440" fill="white" style="fill:white">2</text><circle class="corner" cx="300" cy="100" r="13"/><text class="idx" x="300" y="100" fill="white" style="fill:white">3</text><circle class="mid" cx="305" cy="440" r="13"/><text class="idx" x="305" y="440" fill="white" style="fill:white">4</text><circle class="mid" cx="395" cy="270" r="13"/><text class="idx" x="395" y="270" fill="white" style="fill:white">5</text><circle class="mid" cx="210" cy="270" r="13"/><text class="idx" x="210" y="270" fill="white" style="fill:white">6</text><text x="77" y="466" class="sm">(L1=1)</text><text x="467" y="467" class="sm">(L2=1)</text><text x="302" y="81" class="sm">(L3=1)</text><path d="M190 440 H245 M245 440 l-14 -7 v14z" fill="#299677" stroke="#299677" stroke-width="3"/><rect class="note" x="565" y="121" width="370" height="277" rx="12"/><text x="586" y="160" class="h" style="font-size:20px">Orientation</text><text x="58