<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" role="img" aria-label="FIG_SHEAR_TYING.svg"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263449}.h{font-size:24px;font-weight:700}.sub{font-size:15px}.sm{font-size:13px}.idx{font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central}.corner{fill:#165f99;stroke:#fff;stroke-width:2}.mid{fill:#df8b28;stroke:#fff;stroke-width:2}.gauss{fill:#2d9e81;stroke:#fff;stroke-width:1.5}.tying{fill:#c94d65;stroke:#fff;stroke-width:1.5}.axis{stroke:#6b7786;stroke-width:2}.frame{stroke:#203850;stroke-width:2.6;fill:#f9fbfd}.note{fill:#f6f8fb;stroke:#cad3df}</style><text class="h" x="30" y="39">Q8 transverse shear · interpolation strategies</text><text class="sub" x="30" y="66">Schematics distinguish evaluation (green) from tying (red); exact tying coordinates require operator-specific verification.</text><text class="sub" x="40" y="114">BDG4 · 4 constraints / component</text><rect class="frame" x="72" y="159" width="245" height="245"/><circle class="tying" cx="255.8" cy="281.5" r="13"/><text class="idx" x="255.8" y="281.5" fill="white" style="fill:white">1</text><circle class="tying" cx="133.2" cy="281.5" r="13"/><text class="idx" x="133.2" y="281.5" fill="white" style="fill:white">2</text><circle class="tying" cx="194.5" cy="220.2" r="13"/><text class="idx" x="194.5" y="220.2" fill="white" style="fill:white">3</text><circle class="tying" cx="194.5" cy="342.8" r="13"/><text class="idx" x="194.5" y="342.8" fill="white" style="fill:white">4</text><text class="sub" x="365" y="114">tensor6 · 6 constraints / component</text><rect class="frame" x="397" y="159" width="245" height="245"/><circle class="tying" cx="446.0" cy="281.5" r="13"/><text class="idx" x="446.0" y="281.5" fill="white" style="fill:white">1</text><circle class="tying" cx="593.0" cy="281.5" r="13"/><text class="idx" x="593.0" y="281.5" fill="white" style="fill:white">2</text><circle class="tying" cx="519.5" cy="355.0" r="13"/><text class="idx" x="519.5" y="355.0" fill="white" style="fill:white">3</text><circle class="tying" cx="519.5" cy="208.0" r="13"/><text class="idx" x="519.5" y="208.0" fill="white" style="fill:white">4</text><circle class="tying" cx="452.1" cy="348.9" r="13"/><text class="idx" x="452.1" y="348.9" fill="white" style="fill:white">5</text><circle class="tying" cx="586.9" cy="214.1" r="13"/><text class="idx" x="586.9" y="214.1" fill="white" style="fill:white">6</text><text class="sub" x="690" y="114">Direct · evaluate at Gauss points</text><rect class="frame" x="722" y="159" width="245" height="245"/><circle class="gauss" cx="749.6" cy="376.4" r="13"/><text class="idx" x="749.6" y="376.4" fill="white" style="fill:white">1</text><circle class="gauss" cx="844.5" cy="376.4" r="13"/><text class="idx" x="844.5" y="376.4" fill="white" style="fill:white">2</text><circle class="gauss" cx="939.4" cy="376.4" r="13"/><text class="idx" x="939.4" y="376.4" fill="white" style="fill:white">3</text><circle class="gauss" cx="749.6" cy="281.5" r="13"/><text class="idx" x="749.6" y="281.5" fill="white" style="fill:white">4</text><circle class="gauss" cx="844.5" cy="281.5" r="13"/><text class="idx" x="844.5" y="281.5" fill="white" style="fill:white">5</text><circle class="gauss" cx="939.4" cy="281.5" r="13"/><text class="idx" x="939.4" y="281.5" fill="white" style="fill:white">6</text><circle class="gauss" cx="749.6" cy="186.6" r="13"/><text class="idx" x="749.6" y="186.6" fill="white" style="fill:white">7</text><circle class="gauss" cx="844.5" cy="186.6" r="13"/><text class="idx" x="844.5" y="186.6" fill="white" style="fill:white">8</text><circle class="gauss" cx="939.4" cy="186.6" r="13"/><text class="idx" x="939.4" y="186.6" fill="white" style="fill:white">9</text><text x="42" y="459" class="sub">BDG4 / tensor6: fitted/interpolated assumed shear; direct: Bₛ from physical displacement gradients.</text><text x="42" y="483" class="sm">Point arrangement is a pedagogical schematic, not a claim of e