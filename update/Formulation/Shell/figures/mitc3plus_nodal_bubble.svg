 <text x="466" y="390" font-style="italic">r</text><text x="296" y="177" font-style="italic">s</text>
 </g>
 <path d="M116 385 L213 385" stroke="#1a7f59" stroke-width="2" marker-end="url(#arrow)"/>
 <path d="M116 385 L161 318" stroke="#1a7f59" stroke-width="2" marker-end="url(#arrow)"/>
 <text x="230" y="388" font-family="Arial" fill="#1a7f59">r</text><text x="160" y="307" font-family="Arial" fill="#1a7f59">s</text>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1a7f59"/></marker></defs>
 <text x="35" y="502" font-family="Arial" font-size="14" fill="#56677a">Reference coordinates are schematic; the physical local (x,y,z) frame is right-handed.</text>
