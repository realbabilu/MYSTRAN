<svg xmlns="http://www.w3.org/2000/svg" width="780" height="515" viewBox="0 0 780 515" role="img" aria-label="MITC3+ corner node numbering and internal rotational bubble">
 <rect width="780" height="515" fill="#fff"/>
 <text x="35" y="40" font-size="23" font-family="Arial" font-weight="bold" fill="#18283f">MITC3+ reference triangle: 18 external + 2 internal DOFs</text>
 <path d="M110 407 L650 407 L320 94 Z" fill="#eaf3ff" stroke="#2865a0" stroke-width="3"/>
 <path d="M110 407 L650 407" stroke="#2865a0" stroke-width="4"/>
 <circle cx="110" cy="407" r="9" fill="#1b5a95"/><circle cx="650" cy="407" r="9" fill="#1b5a95"/><circle cx="320" cy="94" r="9" fill="#1b5a95"/>
 <circle cx="360" cy="303" r="11" fill="#e08b22" stroke="#8a5006" stroke-width="2"/>
 <g font-family="Arial" font-size="20" fill="#18283f">
 <text x="80" y="448" font-weight="bold">1 (0, 0)</text><text x="592" y="448" font-weight="bold">2 (1, 0)</text><text x="288" y="78" font-weight="bold">3 (0, 1)</text>
 <text x="385" y="301" font-weight="bold" fill="#925400">4: bubble β₄</text>
