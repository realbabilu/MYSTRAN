<svg xmlns="http://www.w3.org/2000/svg" width="780" height="530" viewBox="0 0 780 530" role="img" aria-label="MITC3+ three area Gauss points and their barycentric coordinates">
 <rect width="780" height="530" fill="#fff"/>
 <text x="35" y="39" font-size="23" font-family="Arial" font-weight="bold" fill="#18283f">Area integration: 3-point triangular Gauss rule</text>
 <path d="M100 430 L640 430 L100 100 Z" fill="#eaf3ff" stroke="#2865a0" stroke-width="3"/>
 <g font-family="Arial" font-size="17" fill="#18283f"><text x="75" y="458">Node 1</text><text x="610" y="458">Node 2</text><text x="65" y="90">Node 3</text></g>
 <g fill="#d55840" stroke="#9d3229" stroke-width="1.7">
 <circle cx="190" cy="375" r="9"/><circle cx="460" cy="375" r="9"/><circle cx="190" cy="210" r="9"/>
 </g>
 <g font-family="Arial" font-size="18" fill="#9b3326">
  <text x="210" y="365">G1 (1/6, 1/6)</text>
  <text x="475" y="363">G2 (2/3, 1/6)</text>
  <text x="210" y="200">G3 (1/6, 2/3)</text>
 </g>
 <text x="360" y="493" font-family="Arial" font-size="18" fill="#18283f">Each point: area weight A/3</text>
 <text x="40" y="520" font-family="Arial" font-size="14" fill="#5c6979">Numerical integration points; distinct from the six interior shear-tying samples A–F.</text>
