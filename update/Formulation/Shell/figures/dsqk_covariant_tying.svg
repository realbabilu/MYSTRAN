<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="340" viewBox="0 0 1060 340"><rect width="1060" height="340" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#17304b} .box{fill:#f3f7fc;stroke:#5279a3;stroke-width:2} .arrow{stroke:#345d82;stroke-width:2.5;fill:none;marker-end:url(#a)} .h{font-size:21px;font-weight:bold} .b{font-size:16px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#345d82"/></marker></defs><rect class="box" x="26" y="73" width="220" height="164" rx="13"/><text class="h" x="136" y="109" text-anchor="middle">Physical shear</text><text class="b" x="136" y="152" text-anchor="middle">gamma-x, gamma-y</text><text class="b" x="136" y="193" text-anchor="middle">at four edge midpoints</text><path class="arrow" d="M250 156 H285"/><rect class="box" x="289" y="73" width="219" height="164" rx="13"/><text class="h" x="398" y="109" text-anchor="middle">Covariant tying</text><text class="b" x="398" y="152" text-anchor="middle">J-transpose at A–D</text><text class="b" x="398" y="193" text-anchor="middle">gamma-xi / gamma-eta</text><path class="arrow" d="M512 156 H546"/><rect class="box" x="552" y="73" width="218" height="164" rx="13"/><text class="h" x="661" y="109" text-anchor="middle">Interpolation</text><text class="b" x="661" y="152" text-anchor="middle">xi across opposite sides</text><text class="b" x="661" y="193" text-anchor="middle">eta across opposite sides</text><path class="arrow" d="M775 156 H811"/><rect class="box" x="817" y="73" width="220" height="164" rx="13"/><text class="h" x="927" y="109" text-anchor="middle">Physical recovery</text><text class="b" x="927" y="152" text-anchor="middle">J-inverse-transpose</text><text class="b" x="927" y="193" text-anchor="middle">Gauss-point B-shear</text><text x="530" y="286" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">DSQK covariant-shear update: same edge points, different interpolation space</text></svg>